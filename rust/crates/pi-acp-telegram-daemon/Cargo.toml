[package]
name = "pi-acp-telegram-daemon"
version = "0.1.0"
edition = "2021"
description = "Telegram relay daemon for pi-acp-workbench (Rust port of telegram-daemon)"
license = "Apache-2.0"

[dependencies]
pi-acp-core = { path = "../pi-acp-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
indexmap = "2"
