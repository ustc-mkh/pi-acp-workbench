[package]
name = "pi-acp-telegram-daemon"
version = "0.1.0"
edition = "2021"
description = "Telegram relay daemon for pi-acp-workbench (Rust port of telegram-daemon)"
license = "Apache-2.0"

[features]
# Unsafe mock transport hooks, only for the isolated contract-test binary.
contract-test = []

[dependencies]
pi-acp-core = { path = "../pi-acp-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
indexmap = "2"
pulldown-cmark = "0.13"
base64 = "0.22"
percent-encoding = "2"
libc = "0.2"
