[package]
name = "pi-acp-core"
version = "0.1.0"
edition = "2021"
description = "Shared atomic persistence and panic isolation primitives for pi-acp-workbenchd"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
