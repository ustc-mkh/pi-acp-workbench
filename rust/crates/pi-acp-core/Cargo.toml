[package]
name = "pi-acp-core"
version = "0.1.0"
edition = "2021"
description = "Shared wire client, atomic writes and proper-lockfile-compatible mkdir locks"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
